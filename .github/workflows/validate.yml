name: Validate AuthZBench-SaaS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  public-validation:
    name: Public validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show tool versions
        run: |
          python --version
          docker --version
          docker compose version

      - name: Run public validation gates
        run: python scripts/validate_public.py --include-scripted-baseline --include-container-smoke

      - name: Claim-boundary phrase check
        run: python scripts/check_claim_boundary.py

      - name: Task oracle audit (schema gate)
        run: python scripts/generate_task_oracle_audit.py --check

      - name: Task taxonomy report
        run: python scripts/generate_task_taxonomy.py

      - name: Baseline variance and confidence
        run: python scripts/analyze_baseline_variance.py --require-current-public

      - name: Harbor non-claim test
        run: python -m pytest tests/test_harbor_claim_boundary.py -q

      - name: External review summary gate
        run: python scripts/validate_external_review_summary.py

      - name: Submission bundle validator (smoke)
        run: python -m pytest tests/test_submission_bundle_validator.py -q

      - name: Reproduce public artifact
        run: python scripts/reproduce_public_artifact.py
