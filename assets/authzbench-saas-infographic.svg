<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AuthZBench-SaaS benchmark flow</title>
  <desc id="desc">Infographic showing seeded SaaS tasks flowing through an AI agent, JSON evidence, backend replay scoring, and leaderboard metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0d1b2f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#0c1728"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#38bdf8"/>
    </marker>
    <style>
      .title { font: 800 56px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b8c7da; }
      .panel-title { font: 800 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .small { font: 700 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8fb2d2; letter-spacing: 1px; }
      .metric { font: 800 35px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .metric-label { font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .chip { font: 800 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #07111f; }
      .code { font: 700 17px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #d1fae5; }
      .muted-line { stroke: #253b58; stroke-width: 2; }
      .bright-line { stroke: #38bdf8; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.2">
    <path d="M0 760 C260 655 395 855 650 730 C890 612 1035 670 1210 555 C1395 435 1495 475 1600 390" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M0 820 C230 730 365 890 610 808 C870 720 1005 760 1195 675 C1375 595 1515 620 1600 575" fill="none" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <text x="70" y="86" class="small">PUBLIC AI SECURITY BENCHMARK</text>
  <text x="70" y="148" class="title">AuthZBench-SaaS</text>
  <text x="70" y="190" class="subtitle">Can an agent prove SaaS authorization failures without crying wolf?</text>

  <g transform="translate(70 238)" filter="url(#shadow)">
    <rect width="275" height="118" rx="18" fill="#0f2138" stroke="#2dd4bf" stroke-width="2"/>
    <text x="28" y="43" class="metric">15</text>
    <text x="85" y="43" class="metric-label">public tasks</text>
    <text x="28" y="82" class="body">6 vulnerable, 9 controls</text>
  </g>
  <g transform="translate(375 238)" filter="url(#shadow)">
    <rect width="275" height="118" rx="18" fill="#0f2138" stroke="#22c55e" stroke-width="2"/>
    <text x="28" y="43" class="metric">2</text>
    <text x="72" y="43" class="metric-label">Dockerized apps</text>
    <text x="28" y="82" class="body">project_mgmt + billing</text>
  </g>
  <g transform="translate(680 238)" filter="url(#shadow)">
    <rect width="305" height="118" rx="18" fill="#0f2138" stroke="#fbbf24" stroke-width="2"/>
    <text x="28" y="43" class="metric">0.0</text>
    <text x="118" y="43" class="metric-label">false-positive rate</text>
    <text x="28" y="82" class="body">for current model baselines</text>
  </g>

  <g transform="translate(70 430)">
    <line x1="245" y1="100" x2="320" y2="100" class="bright-line" marker-end="url(#arrow)"/>
    <line x1="565" y1="100" x2="640" y2="100" class="bright-line" marker-end="url(#arrow)"/>
    <line x1="885" y1="100" x2="960" y2="100" class="bright-line" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect width="245" height="245" rx="24" fill="url(#panel)" stroke="#284668" stroke-width="2"/>
      <circle cx="56" cy="62" r="27" fill="url(#cyan)"/>
      <path d="M48 62 h16 M56 54 v16" stroke="#07111f" stroke-width="5" stroke-linecap="round"/>
      <text x="28" y="122" class="panel-title">Seeded SaaS</text>
      <text x="28" y="154" class="body">Tenants, roles,</text>
      <text x="28" y="181" class="body">objects, tokens</text>
      <rect x="28" y="205" width="88" height="28" rx="14" fill="url(#green)"/>
      <text x="45" y="225" class="chip">BOLA</text>
      <rect x="126" y="205" width="88" height="28" rx="14" fill="url(#cyan)"/>
      <text x="144" y="225" class="chip">BFLA</text>
    </g>

    <g transform="translate(320 0)" filter="url(#shadow)">
      <rect width="245" height="245" rx="24" fill="url(#panel)" stroke="#284668" stroke-width="2"/>
      <rect x="34" y="42" width="176" height="92" rx="14" fill="#091827" stroke="#38bdf8" stroke-width="2"/>
      <text x="52" y="77" class="code">{ finding }</text>
      <text x="52" y="108" class="code">GET /api/...</text>
      <text x="28" y="170" class="panel-title">Agent Evidence</text>
      <text x="28" y="203" class="body">Structured JSON,</text>
      <text x="28" y="230" class="body">not prose vibes</text>
    </g>

    <g transform="translate(640 0)" filter="url(#shadow)">
      <rect width="245" height="245" rx="24" fill="url(#panel)" stroke="#284668" stroke-width="2"/>
      <path d="M68 48 h105 a18 18 0 0 1 18 18 v58 a18 18 0 0 1-18 18 H68 a18 18 0 0 1-18-18 V66 a18 18 0 0 1 18-18Z" fill="#0b253b" stroke="#22c55e" stroke-width="3"/>
      <path d="M79 96 l27 27 l62-66" fill="none" stroke="#a3e635" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="170" class="panel-title">Replay Scorer</text>
      <text x="28" y="203" class="body">Backend proof plus</text>
      <text x="28" y="230" class="body">denial controls</text>
    </g>

    <g transform="translate(960 0)" filter="url(#shadow)">
      <rect width="245" height="245" rx="24" fill="url(#panel)" stroke="#284668" stroke-width="2"/>
      <g transform="translate(34 42)">
        <rect width="46" height="116" rx="10" fill="#22c55e"/>
        <rect x="66" y="54" width="46" height="62" rx="10" fill="#38bdf8"/>
        <rect x="132" y="23" width="46" height="93" rx="10" fill="#fbbf24"/>
        <line x1="0" y1="132" x2="178" y2="132" stroke="#5b718d" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text x="28" y="170" class="panel-title">Leaderboard</text>
      <text x="28" y="203" class="body">Exploit proof, FP</text>
      <text x="28" y="230" class="body">rate, safety, time</text>
    </g>
  </g>

  <g transform="translate(1045 220)" filter="url(#shadow)">
    <rect width="485" height="200" rx="24" fill="#0b1728" stroke="#314e70" stroke-width="2"/>
    <text x="30" y="46" class="small">WHAT MAKES IT HARD</text>
    <line x1="30" y1="68" x2="455" y2="68" class="muted-line"/>
    <circle cx="44" cy="102" r="8" fill="#38bdf8"/>
    <text x="66" y="108" class="body">Multi-actor tenant boundaries</text>
    <circle cx="44" cy="136" r="8" fill="#22c55e"/>
    <text x="66" y="142" class="body">Secure controls punish over-reporting</text>
    <circle cx="44" cy="170" r="8" fill="#fbbf24"/>
    <text x="66" y="176" class="body">Scorer verifies proof, not confidence</text>
  </g>

  <g transform="translate(1125 704)">
    <rect width="455" height="74" rx="18" fill="#07111f" stroke="#38bdf8" stroke-width="2"/>
    <text x="28" y="32" class="small">CORE QUESTION</text>
    <text x="28" y="57" class="body">Did the agent prove the boundary, or just narrate it?</text>
  </g>
</svg>
