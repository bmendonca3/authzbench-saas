services:
  project_mgmt:
    build:
      context: .
      dockerfile: apps/project_mgmt/Dockerfile
    user: "${AUTHZBENCH_DOCKER_UID:-1000}:${AUTHZBENCH_DOCKER_GID:-1000}"
    environment:
      AUTHZBENCH_REQUEST_LOG_DIR: /bench/captures/request-logs
    volumes:
      - ./captures/request-logs:/bench/captures/request-logs
    ports:
      - "127.0.0.1:8011:8011"
  billing:
    build:
      context: .
      dockerfile: apps/billing/Dockerfile
    user: "${AUTHZBENCH_DOCKER_UID:-1000}:${AUTHZBENCH_DOCKER_GID:-1000}"
    environment:
      AUTHZBENCH_REQUEST_LOG_DIR: /bench/captures/request-logs
    volumes:
      - ./captures/request-logs:/bench/captures/request-logs
    ports:
      - "127.0.0.1:8012:8012"
