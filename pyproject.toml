[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authzbench-saas"
version = "0.0.1"
description = "Benchmark scaffold for AI agents testing multi-tenant SaaS authorization."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bmendonca3" }]
keywords = ["ai-agents", "benchmark", "authorization", "appsec", "saas", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[tool.setuptools]
packages = ["authzbench", "apps", "apps.project_mgmt", "apps.billing", "apps.support", "apps.file_sharing", "apps.api_tokens"]
